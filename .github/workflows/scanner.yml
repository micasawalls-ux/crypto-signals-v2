name: Run Crypto Scanner

on:
  schedule:
    # This runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # This allows you to trigger it manually from GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests groq

      - name: Run Scanner Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scanner.py

      - name: Commit and push updated signals.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/signals.json
          git diff --staged --quiet || git commit -m "Automated signals update $(date -u +'%Y-%m-%d %H:%M')"
          git push
